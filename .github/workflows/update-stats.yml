name: 更新主页贡献

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'huyengiang101086-spec/huyengiang101086-spec'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          clean: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: 获取公开贡献并更新图片
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contrib.py huyengiang101086-spec --out . --theme t1 --accent blue --language zh --top 4
      - name: 检查主页资源
        run: python scripts/verify_render.py --local .
      - name: 提交更新内容
        shell: bash
        run: |
          set -euo pipefail
          git add README.md assets/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public contribution statistics"
          git push origin HEAD:main

